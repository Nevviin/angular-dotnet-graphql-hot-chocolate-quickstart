<section class="dashboard">
  <h2>{{ title() }}</h2>
  <!-- 
  <button type="button" (click)="loadStock()" [disabled]="loading()">
    {{ loading() ? 'Loading...' : 'Load stock' }}
  </button> -->


  <label for="ticker">Stock Ticker</label>
  <input #tickerInput id="ticker" type="text" placeHolder="eg. AAPL" (keyup.enter)="loadStock(tickerInput.value)">
  <button type="button" (click)="loadStock(tickerInput.value)" [disabled]="loading()">
    {{ loading() ? 'loading...' : ' Load Stock'}}
    >

  </button>

  @if (error()) {
  <p class="error">{{ error() }}</p>
  }

  @if (stock(); as quote) {
  <div class="stock-card">
    <p class="label">Selected symbol</p>
    <h3>{{ quote.symbol }}</h3>
    <p>{{ quote.name }}</p>
    <p>Price: ${{ quote.price }}</p>
    @if (quote.change !== undefined) {
    <p>Change: {{ quote.change }}</p>
    }
  </div>
  }
</section>
